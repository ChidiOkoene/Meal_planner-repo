# Local development services only. Application apps run on the host with `pnpm dev`.
name: dyjext-care

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dyjext
      POSTGRES_PASSWORD: dyjext_local_only
      POSTGRES_DB: dyjext
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dyjext -d dyjext']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
